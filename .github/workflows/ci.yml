name: CI Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Login DockerHub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USER }}
        password: ${{ secrets.DOCKER_PASS }}

    - name: Build & Push
      run: |
        docker build -t ${{ secrets.DOCKER_USER }}/sre-app:latest .
        docker push ${{ secrets.DOCKER_USER }}/sre-app:latest
